<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pagehead('E-Shelf — Sign Up')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar('signup')}"></header>

<main class="auth-main">
    <section class="hero auth-hero">
        <div class="hero-text">
            <p class="eyebrow">Join E-Shelf</p>
            <h2 class="hero-title">Create your customer account</h2>
            <p class="hero-sub">Buy books to keep, or rent them for 14 days and bring them back.</p>
        </div>
    </section>

    <section class="card auth-card">
        <div class="auth-tabs">
            <a th:href="@{/login}" class="auth-tab">Login</a>
            <a th:href="@{/signup}" class="auth-tab active">Sign Up</a>
        </div>

        <form th:action="@{/signup}" method="post">
            <div class="form-grid">
                <div class="form-group">
                    <label for="fullName">Full name <span class="req">*</span></label>
                    <input type="text" id="fullName" name="fullName" th:value="${fullName}"
                           placeholder="e.g. Ravi Kumar" required minlength="2" maxlength="60">
                    <p class="field-error" th:if="${fullNameError}" th:text="${fullNameError}"></p>
                </div>

                <div class="form-group">
                    <label for="email">Email <span class="req">*</span></label>
                    <input type="email" id="email" name="email" th:value="${email}"
                           placeholder="you@example.com" required>
                    <p class="field-error" th:if="${emailError}" th:text="${emailError}"></p>
                </div>

                <div class="form-group">
                    <label for="username">Username <span class="req">*</span></label>
                    <input type="text" id="username" name="username" th:value="${username}"
                           placeholder="3-20 characters" required minlength="3" maxlength="20">
                    <p class="field-error" th:if="${usernameError}" th:text="${usernameError}"></p>
                </div>

                <div class="form-group">
                    <label for="password">Password <span class="req">*</span></label>
                    <input type="password" id="password" name="password"
                           placeholder="At least 6 characters" required minlength="6">
                    <p class="field-error" th:if="${passwordError}" th:text="${passwordError}"></p>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm password <span class="req">*</span></label>
                    <input type="password" id="confirmPassword" name="confirmPassword"
                           placeholder="Repeat your password" required>
                    <p class="field-error" th:if="${confirmError}" th:text="${confirmError}"></p>
                </div>

                <!-- Pick a question now, and this page can prove it is you if you ever
                     forget the password. Skip it and a librarian has to reset it instead. -->
                <div class="form-group">
                    <label for="securityQuestion">Forgotten-password question</label>
                    <select id="securityQuestion" name="securityQuestion">
                        <option value="">— No question, I'll ask a librarian —</option>
                        <option th:each="q : ${questions}" th:value="${q}" th:text="${q}"
                                th:selected="${q == securityQuestion}">What is your favourite book?</option>
                    </select>
                    <span class="hint">You answer it to set a new password. Your email also works as a login name.</span>
                </div>

                <div class="form-group">
                    <label for="securityAnswer">Your answer</label>
                    <input type="text" id="securityAnswer" name="securityAnswer"
                           th:value="${securityAnswer}" placeholder="e.g. Middlemarch" maxlength="120">
                    <p class="field-error" th:if="${securityAnswerError}" th:text="${securityAnswerError}"></p>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Create account</button>
            </div>
        </form>

        <th:block th:if="${googleSignUp} == true">
            <p class="auth-split"><span>or</span></p>
            <p class="form-actions form-actions-center">
                <a class="btn btn-google" th:href="@{/oauth2/authorization/google-signup}">Create account with Google</a>
            </p>
        </th:block>

        <p class="auth-hint">Already have an account? <a th:href="@{/login}">Log in instead</a></p>
    </section>
</main>
<th:block th:replace="~{fragments/layout :: pageend}"></th:block>
</body>
</html>
