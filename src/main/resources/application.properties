spring.application.name=library-web

# H2 in-memory database (data lives only while the app runs).
# DB_CLOSE_DELAY=-1 keeps the database alive until the JVM exits. Without it H2 drops
# an in-memory database the moment its last connection closes — which is what a laptop
# sleep does to the pooled connections — and the app then came back with an empty
# database, no SITE_USER table, and every login failing with "bad credentials".
spring.datasource.url=jdbc:h2:mem:librarydb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate builds the BOOK table automatically
spring.jpa.hibernate.ddl-auto=update

# H2 web console: http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:librarydb)
spring.h2.console.enabled=true

# Profile pictures: PhotoStorage rejects anything over 2 MB, this stops Tomcat first.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Razorpay test-mode keys. Replace these with the real pair from Razorpay Dashboard ->
# Settings -> API Keys (they start with rzp_test_). The "Pay with Razorpay" button only
# opens a live gateway when these are the genuine values AND the machine can reach
# api.razorpay.com. With the placeholders below it cleanly reports that the gateway refused
# the order instead of crashing, so the rest of the flow still teaches the same code path.
razorpay.key-id=rzp_test_REPLACE_ME
razorpay.key-secret=REPLACE_ME_SECRET

# Google sign-in, if this machine should offer it. The two values come from the environment,
# never from this file, so a live client secret never ends up in the repository. Leave them
# unset and the login page simply has no Google button; see SecurityConfig.
eshelf.google.client-id=${GOOGLE_CLIENT_ID:}
eshelf.google.client-secret=${GOOGLE_CLIENT_SECRET:}

# Render (and any other host) answers plain http:// on its own port behind an https proxy.
# Without this the app builds redirect URLs starting http:// and Google refuses them as an
# unauthorised redirect_uri. "framework" makes Spring trust the X-Forwarded-* headers the
# proxy sends, so the app learns it is really being served over https.
server.forward-headers-strategy=framework
